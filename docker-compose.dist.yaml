x-shared-logs: &shared-logs
  logging:
    driver: "json-file"
    options:
      max-size: "10k"

services:
  backend:
    #image: ghcr.io/vamplabai/sgr-agent-core:latest
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - --config-file=/app/examples/sgr_deep_research/config.yaml
    container_name: sgr-agent-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    volumes:
      - .:/app
    networks:
      - sgr-network
    <<: *shared-logs

  frontend:
    build:
      context: ./sgr-agent-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8010}
        - VITE_APP_ENV=${VITE_APP_ENV:-production}
    container_name: sgr-agent-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - sgr-network
    <<: *shared-logs

networks:
  sgr-network:
    driver: bridge
